name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Docker version
        run: docker --version

      - name: Build Docker images
        run: |
          docker build -t udagram-api-feed ./udagram-api-feed
          docker build -t udagram-api-user ./udagram-api-user
          docker build -t udagram-frontend ./udagram-frontend
          docker build -t reverseproxy ./udagram-reverseproxy

      - name: Tag Docker images
        run: |
          docker tag udagram-api-feed halalalala/udagram-api-feed:v3
          docker tag udagram-api-user halalalala/udagram-api-user:v3
          docker tag udagram-frontend halalalala/udagram-frontend:v3
          docker tag reverseproxy halalalala/reverseproxy:v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker images
        run: |
          docker push halalalala/udagram-api-feed:v3
          docker push halalalala/udagram-api-user:v3
          docker push halalalala/udagram-frontend:v3
          docker push halalalala/reverseproxy:v3
